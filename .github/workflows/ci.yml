name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankflow
          POSTGRES_USER: bankflow
          POSTGRES_PASSWORD: bankflow_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bankflow -d bankflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://bankflow:bankflow_dev@localhost:5433/bankflow
      JWT_SECRET: ci_jwt_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankflow
          POSTGRES_USER: bankflow
          POSTGRES_PASSWORD: bankflow_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bankflow -d bankflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bankflow:bankflow_dev@localhost:5433/bankflow
      JWT_SECRET: ci_jwt_secret
      VITE_API_BASE_URL: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npm run db:seed
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start backend
        run: |
          npm start > ../backend-ci.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 2
          done
          cat ../backend-ci.log
          exit 1
        working-directory: backend
      - name: Start frontend
        run: |
          npm run dev -- --host 127.0.0.1 > ../frontend-ci.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://localhost:5173 && exit 0
            sleep 2
          done
          cat ../frontend-ci.log
          exit 1
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
